##############################################################
# Joben — LaTeX Compiler Service (Docker)
# The Next.js app runs on Vercel; only this service needs Docker.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Requires: .env.prod with LATEX_SERVICE_SECRET
##############################################################

networks:
  latex-net:
    driver: bridge
  parser-net:
    driver: bridge

services:
  resume-parser:
    build:
      context: ./resume-parser-service
    container_name: joben-resume-parser
    restart: unless-stopped
    networks: [parser-net]
    environment:
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      RESUME_PARSER_SHARED_SECRET: ${RESUME_PARSER_SHARED_SECRET}
    ports:
      # Set PARSER_BIND=127.0.0.1 when a TLS reverse proxy fronts this service.
      - "${PARSER_BIND:-0.0.0.0}:8000:8000"
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  latex-service:
    build:
      context: ./latex-service
    container_name: joben-latex
    restart: unless-stopped
    networks: [latex-net]
    ports:
      # Set LATEX_BIND=127.0.0.1 when a TLS reverse proxy fronts this service.
      - "${LATEX_BIND:-0.0.0.0}:3001:3001"
    environment:
      PORT: 3001
      LATEX_SERVICE_SECRET: ${LATEX_SERVICE_SECRET}
      LATEX_SERVICE_AUTH_REQUIRED: "true"
    mem_limit: 512m
    cpus: "0.75"
    healthcheck:
      # /health needs the secret now that auth is enforced.
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$LATEX_SERVICE_SECRET\" http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
